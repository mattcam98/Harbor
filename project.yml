# XcodeGen spec. Harbor.xcodeproj is generated from this file and is not
# committed:  xcodegen generate
name: Harbor

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Overridden per developer in CodeSigning.xcconfig for device builds.
    HARBOR_BUNDLE_ID: me.mattcam.harbor

packages:
  HarborCore:
    path: Packages/HarborCore
  HarborPlatform:
    path: Packages/HarborPlatform

targets:
  Harbor:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist]
    dependencies:
      - package: HarborCore
      - package: HarborPlatform
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Harbor
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        # Documents holds nothing sensitive, and is not exposed to Files/iTunes.
        UIFileSharingEnabled: false
        LSSupportsOpeningDocumentsInPlace: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HARBOR_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1,2"

  HarborTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: Harbor
      - package: HarborCore
      - package: HarborPlatform
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(HARBOR_BUNDLE_ID).tests

schemes:
  Harbor:
    build:
      targets:
        Harbor: all
        HarborTests: [test]
    test:
      targets: [HarborTests]
