# XcodeGen spec. Harbor.xcodeproj is generated from this file and is not
# committed. Generate it with scripts/generate-project.sh, which also installs
# the dependency lockfile.
#
# Process model (LiveContainer's, unchanged): the app executable is a small
# stub. At launch the engine decides whether this process becomes a guest app
# or shows Harbor's own interface, which lives in a framework and is only
# loaded in the second case.
name: Harbor

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

# DEVELOPMENT_TEAM and HARBOR_BUNDLE_ID come from here. The file is created
# from CodeSigning.xcconfig.sample by scripts/generate-project.sh.
configFiles:
  Debug: CodeSigning.xcconfig
  Release: CodeSigning.xcconfig

packages:
  HarborCore:
    path: Packages/HarborCore
  HarborPlatform:
    path: Packages/HarborPlatform
  HarborSigning:
    path: Packages/HarborSigning
  HarborDevice:
    path: Packages/HarborDevice
  SideSign:
    path: Vendor/SideSign

# Settings shared by the targets built from LiveContainer's sources.
settingGroups:
  engine:
    HEADER_SEARCH_PATHS:
      - $(inherited)
      # LiveContainer includes "../litehook/src/litehook.h" relative to its
      # own checkout; resolved from here that is Vendor/litehook.
      - $(SRCROOT)/Vendor/LiveContainer
      - $(SRCROOT)/Vendor/LiveContainer/LiveContainer
      - $(SRCROOT)/Vendor/litehook/external/include
      - $(SRCROOT)/Vendor/litehook/src
      # LCUtils.h: declarations only, shared with LiveContainer's own interface.
      - $(SRCROOT)/Vendor/LiveContainer/LiveContainerSwiftUI/Utilities
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    # Vendored code: its warnings are not ours to fix here.
    GCC_WARN_INHIBIT_ALL_WARNINGS: YES
    GENERATE_INFOPLIST_FILE: YES
    SKIP_INSTALL: YES
  # Libraries are signed when they are embedded in the app, with the app's
  # identity. Signing them on their own as well only adds provisioning
  # requests that can fail.
  signedWhenEmbedded:
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO

targets:
  # The stub. LiveContainer's main.c, entered at LiveContainerMainC, loads
  # the engine and hands over.
  Harbor:
    type: application
    platform: iOS
    sources:
      - path: Vendor/LiveContainer/LiveContainer/main.c
      # The app icon. Its images are drawn by scripts/render-icon.swift.
      - path: Host/Assets.xcassets
    dependencies:
      # Loaded with dlopen at run time, so embedded but not linked: a process
      # that becomes a guest never loads Harbor's interface or signing code.
      - target: LiveContainerShared
        link: false
        embed: true
      - target: HarborUI
        link: false
        embed: true
      # A bare dylib; the build phase below copies it into Frameworks, where
      # the engine expects it.
      - target: TweakLoader
        link: false
        embed: false
    postBuildScripts:
      - name: Embed the tweak loader and the interface's package frameworks
        script: bash "$SRCROOT/scripts/embed-package-frameworks.sh"
        basedOnDependencyAnalysis: false
    info:
      path: Host/Info.plist
      properties:
        CFBundleDisplayName: Harbor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        # Documents holds guest apps and their data; it is not exposed to
        # Files or a computer.
        UIFileSharingEnabled: false
        LSSupportsOpeningDocumentsInPlace: false
        NSLocalNetworkUsageDescription: Harbor installs apps by talking to this device through the LocalDevVPN tunnel.
        # The engine reads the first URL scheme as this app's identity.
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [harbor]
    entitlements:
      path: Host/Harbor.entitlements
      properties:
        # The first group is the default: Harbor's own secrets live there.
        # The rest are for guests. The engine moves each guest's keychain
        # use into one of them, by this exact name, so guests do not share
        # Harbor's keychain or each other's.
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(HARBOR_BUNDLE_ID)
          - $(AppIdentifierPrefix)com.kdt.livecontainer.shared
          - $(AppIdentifierPrefix)com.kdt.livecontainer.shared.1
          - $(AppIdentifierPrefix)com.kdt.livecontainer.shared.2
          - $(AppIdentifierPrefix)com.kdt.livecontainer.shared.3
          - $(AppIdentifierPrefix)com.kdt.livecontainer.shared.4
          - $(AppIdentifierPrefix)com.kdt.livecontainer.shared.5
          - $(AppIdentifierPrefix)com.kdt.livecontainer.shared.6
          - $(AppIdentifierPrefix)com.kdt.livecontainer.shared.7
          - $(AppIdentifierPrefix)com.kdt.livecontainer.shared.8
          - $(AppIdentifierPrefix)com.kdt.livecontainer.shared.9
          - $(AppIdentifierPrefix)com.kdt.livecontainer.shared.10
          - $(AppIdentifierPrefix)com.kdt.livecontainer.shared.11
          - $(AppIdentifierPrefix)com.kdt.livecontainer.shared.12
          - $(AppIdentifierPrefix)com.kdt.livecontainer.shared.13
          - $(AppIdentifierPrefix)com.kdt.livecontainer.shared.14
          - $(AppIdentifierPrefix)com.kdt.livecontainer.shared.15
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HARBOR_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: ["$(inherited)", "-e", "_LiveContainerMainC"]
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks"]
        # The executable must be the stub itself in every configuration, not
        # a launcher for a debug dylib: the engine replaces this process's
        # idea of its own executable.
        ENABLE_DEBUG_DYLIB: NO
        # The embedding script reads other targets' build products.
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  # LiveContainer's engine: bootstrap, dyld and Foundation hooks, litehook.
  LiveContainerShared:
    type: framework
    platform: iOS
    sources:
      - path: Vendor/LiveContainer/LiveContainer
        # Its headers are private to the engine, not part of a public interface.
        headerVisibility: project
        includes:
          - LCBootstrap.m
          - LCMachOUtils.m
          - LCSharedUtils.m
          - Localization.m
          - dyld_bypass_validation.m
          - utils.m
          - "Tweaks/**"
      - path: Vendor/litehook/src/litehook.c
    settings:
      groups: [engine, signedWhenEmbedded]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HARBOR_BUNDLE_ID).engine
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "FISHHOOK_EXPORT=1"]
        OTHER_CFLAGS: ["$(inherited)", "-fcommon"]
        DEFINES_MODULE: NO
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks", "@loader_path/Frameworks"]

  # Loaded into a guest before its code runs; carries the UIKit hooks.
  TweakLoader:
    type: library.dynamic
    platform: iOS
    sources:
      - path: Vendor/LiveContainer/TweakLoader
        includes: ["*.m"]
    dependencies:
      - target: LiveContainerShared
        embed: false
    settings:
      groups: [engine, signedWhenEmbedded]
      base:
        PRODUCT_NAME: TweakLoader
        EXECUTABLE_PREFIX: ""
        GENERATE_INFOPLIST_FILE: NO
        OTHER_LDFLAGS:
          - $(inherited)
          - -Wl,-U,_OBJC_CLASS_$_FBSSceneParameters
          - -Wl,-U,_OBJC_CLASS_$_LSApplicationWorkspace
          - -Wl,-U,_OBJC_CLASS_$_DOCConfiguration

  # Harbor's interface. The engine loads it by the name LiveContainer gives
  # its own, so the product keeps that name; the Swift module is HarborUI.
  HarborUI:
    type: framework
    platform: iOS
    sources: [App]
    dependencies:
      - package: HarborCore
      - package: HarborPlatform
      - package: HarborSigning
      - package: HarborDevice
      - package: SideSign
        product: SideSign
    settings:
      groups: [signedWhenEmbedded]
      base:
        PRODUCT_NAME: LiveContainerSwiftUI
        PRODUCT_MODULE_NAME: HarborUI
        PRODUCT_BUNDLE_IDENTIFIER: $(HARBOR_BUNDLE_ID).ui
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        DEFINES_MODULE: NO
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks", "@loader_path/Frameworks"]

  HarborTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: Harbor
      - package: HarborCore
      - package: HarborPlatform
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(HARBOR_BUNDLE_ID).tests

schemes:
  Harbor:
    build:
      targets:
        Harbor: all
        HarborTests: [test]
    test:
      targets: [HarborTests]
