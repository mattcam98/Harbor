name: Download page

# Publishes site/ to GitHub Pages: the download page and install.sh, which
# its Terminal line runs. Harbor Setup itself is a release asset. This
# workflow reads the latest release of the repository it runs in and has
# scripts/build-site.sh write site/release.json and site/install.sh for it,
# so a fork publishes a page for its own releases. Runs on Linux.
on:
  release:
    types: [published]
  push:
    branches: [main]
    paths: [site/**, scripts/build-site.sh]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Describe the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          # The newest release that isn't a draft, pre-releases included.
          # A failed lookup stops here, so a working page is never replaced
          # by one without its install script; only no release at all
          # publishes the page as "not published yet".
          tag=$(gh api "repos/$REPO/releases?per_page=20" --jq '[.[] | select(.draft | not)][0].tag_name // ""')
          if [ -z "$tag" ]; then
            echo "No release yet, so the page says it is not published." >&2
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "$tag" --repo "$REPO" --pattern HarborSetup-mac.zip --dir "$RUNNER_TEMP/release"
          bash scripts/build-site.sh "$RUNNER_TEMP/release/HarborSetup-mac.zip" "$REPO" "$PAGES_URL" "$tag"
          bash -n site/install.sh
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
