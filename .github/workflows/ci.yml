name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Packages (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS exercises the CryptoKit-backed path the app ships with.
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: swift --version
      - name: Test HarborCore
        working-directory: Packages/HarborCore
        run: swift test
      - name: Build HarborPlatform
        if: runner.os == 'macOS'
        working-directory: Packages/HarborPlatform
        run: swift build

  signing:
    name: HarborSigning (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: true
      - name: Test HarborSigning
        working-directory: Packages/HarborSigning
        # SideSign tracks some dependencies by branch. Refuse to build with
        # anything other than the revisions recorded in Package.resolved.
        run: swift test --force-resolved-versions

  device:
    name: HarborDevice (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: true
      - name: Pick a simulator
        run: bash .github/scripts/pick-simulator.sh
      - name: Test HarborDevice
        working-directory: Packages/HarborDevice
        # minimuxer's prebuilt frameworks only link through Xcode's build
        # system, so this package is tested with xcodebuild on a simulator.
        run: |
          set -o pipefail
          xcodebuild test             -scheme HarborDevice             -destination "platform=iOS Simulator,id=$SIM_UDID"             -onlyUsePackageVersionsFromResolvedFile             | xcbeautify --renderer github-actions

  app:
    name: App (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: true
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          bash scripts/generate-project.sh
      - name: Pick a simulator
        run: bash .github/scripts/pick-simulator.sh
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test             -project Harbor.xcodeproj             -scheme Harbor             -destination "platform=iOS Simulator,id=$SIM_UDID"             -onlyUsePackageVersionsFromResolvedFile             | xcbeautify --renderer github-actions

  ipa:
    name: Unsigned IPA (device build)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: true
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          bash scripts/generate-project.sh
      - name: Build for device without signing
        run: |
          set -o pipefail
          xcodebuild build \
            -project Harbor.xcodeproj \
            -scheme Harbor \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
      - name: Package
        run: bash scripts/package-ipa.sh build/Build/Products/Release-iphoneos/Harbor.app Harbor.ipa
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Harbor-unsigned-ipa
          path: |
            Harbor.ipa
            Harbor.ipa.sha256
          if-no-files-found: error
          retention-days: 14

  differential:
    name: Patcher vs LiveContainer (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: true
      # Patches real iOS executables with LiveContainer's own code and with
      # Harbor's port, and compares the results byte for byte.
      - run: bash scripts/differential-machopatch.sh "$RUNNER_TEMP/macho-fixtures"
