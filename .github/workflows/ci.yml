name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Packages (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS exercises the CryptoKit-backed path the app ships with.
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: swift --version
      - name: Test HarborCore
        working-directory: Packages/HarborCore
        run: swift test
      - name: Build HarborPlatform
        if: runner.os == 'macOS'
        working-directory: Packages/HarborPlatform
        run: swift build

  signing:
    name: HarborSigning (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: true
      - name: Test HarborSigning
        working-directory: Packages/HarborSigning
        # SideSign tracks some dependencies by branch. Refuse to build with
        # anything other than the revisions recorded in Package.resolved.
        run: swift test --force-resolved-versions

  app:
    name: App (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Pick a simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          phones = [d for name in sorted(runtimes) if "iOS" in name
                    for d in runtimes[name] if d["name"].startswith("iPhone")]
          print(phones[-1]["udid"])')
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Harbor.xcodeproj \
            -scheme Harbor \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -skipPackagePluginValidation \
            | xcbeautify --renderer github-actions
